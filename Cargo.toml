[package]
name = "world_generation"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.8"
# Already in the tree via bevy_clipboard; used directly for synchronous clipboard access.
arboard = "3.7"
bevy = { version = "0.20.1", features = ["bevy_dev_tools", "render_dev_tools", "file_watcher"] }
bevy_enhanced_input = "0.27"
bevy_flair = "0.9"
bevy_mod_scripting = { version = "0.24", features = ["lua54"] }
glam27 = { package = "glam", version = "0.27" }
meshless_voronoi = "0.7.2"
noise = "0.9.0"
roxmltree = "0.21"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
# Full DWARF debuginfo makes the linked exe exceed 2 GB, which overflows 32-bit
# PE header fields and Windows refuses to load it ("not a valid application").
debug = "line-tables-only"

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3