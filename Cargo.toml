[package]
name = "world_generation"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = ["bevy_dev_tools", "render_dev_tools", "exr"] }
bevy_hanabi = "0.20.0"
bevy_obj = "0.20.0"
bevy_panorbit_camera = "0.36.0"
bevy_voxel_world = "0.19.1"
bevy_water = "0.20.0"
noise = "0.9.0"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
