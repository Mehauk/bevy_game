<template>
    <property name="title">Command Palette</property>
    <property name="hint">Up/Down select | Tab autofill | Enter run | Esc close</property>

    <node width="100%" height="100%" position="absolute" justify_content="center" align_items="center">
        <node position="absolute" width="100%" height="100%" background="#00000073" on_press="menu_close" />
        <node width="480px" padding="12px" row_gap="8px" flex_direction="column" background="#1E2028" border="1px"
            border_color="#3A3E4C" border_radius="8px">
            <text font_size="18" font_color="#FFFFFF">{title}</text>
            <search_input />
            <node id="palette_list" width="100%" max_height="240px" flex_direction="column" row_gap="4px" />
            <text font_size="12" font_color="#9AA0B4">{hint}</text>
        </node>
    </node>
</template>
