<node id="overlay" class="overlay">
    <node class="backdrop" />
    <node class="bottom-sheet">
        <node class="console-header">
            <node class="header-left">
                <text class="console-tag">CONSOLE</text>
            </node>
            <text class="console-hint">[↑/↓] Select | [Tab] Autocomplete | [Enter] Execute | [Esc/~] Close</text>
        </node>
        <node id="console_history" class="console-history" />
        <node id="suggestions" class="suggestions" />
        <node class="input-row">
            <text class="prompt-symbol">&gt;</text>
            <input id="search" class="console-input" autofocus="true" />
            <text id="suggestion_preview" class="suggestion-preview"></text>
        </node>
    </node>
</node>
