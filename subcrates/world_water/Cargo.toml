[package]
name = "world_water"
version = "0.1.0"
edition = "2024"
description = "Ocean water surface: sea state, FFT swell, shore dynamics, and the sea clipmap"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "bevy_asset",
    "bevy_image",
    "bevy_light",
    "bevy_core_pipeline",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_render",
    "bevy_shader",
] }
bevy_shader_kit = { path = "../../crates/bevy_shader_kit" }
